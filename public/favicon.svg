<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#060D20"/>
  <!-- Fork: rotated -25deg to form the left arm of the X -->
  <g fill="#E5410D" transform="rotate(-25 50 50)">
    <!-- Handle -->
    <rect x="47" y="46" width="6" height="42" rx="3"/>
    <!-- Tines base -->
    <rect x="36" y="34" width="28" height="12" rx="4"/>
    <!-- 4 tines -->
    <rect x="36" y="14" width="4" height="22" rx="2"/>
    <rect x="44" y="10" width="4" height="26" rx="2"/>
    <rect x="52" y="10" width="4" height="26" rx="2"/>
    <rect x="60" y="14" width="4" height="22" rx="2"/>
  </g>
  <!-- Spoon: rotated +25deg to form the right arm of the X -->
  <g fill="#E5410D" transform="rotate(25 50 50)">
    <ellipse cx="50" cy="24" rx="13" ry="17"/>
    <rect x="47" y="38" width="6" height="50" rx="3"/>
  </g>
</svg>
