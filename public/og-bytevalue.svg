<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="bvglow" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#00BF8F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00BF8F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bvbg)"/>
  <rect width="1200" height="630" fill="url(#bvglow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1B2464" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Bar-chart mark -->
  <g transform="translate(90 190)">
    <rect x="0"  y="60" width="24" height="42" rx="4" fill="#00BF8F"/>
    <rect x="36" y="30" width="24" height="72" rx="4" fill="#00BF8F"/>
    <rect x="72" y="0"  width="24" height="102" rx="4" fill="#00BF8F"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="285" fill="#1B2464" font-family="Montserrat, sans-serif" font-weight="900" font-size="96" letter-spacing="-3">Byte<tspan fill="#00BF8F">Value</tspan></text>

  <!-- Tag -->
  <text x="234" y="330" fill="#5567A0" font-family="Inter, sans-serif" font-weight="600" font-size="20" letter-spacing="4">PROFIT INTELLIGENCE REPORT</text>

  <!-- Main line -->
  <text x="90" y="470" fill="#1B2464" font-family="Montserrat, sans-serif" font-weight="800" font-size="48" letter-spacing="-1.5">Your restaurant data, <tspan fill="#00BF8F" font-style="italic">decoded for you.</tspan></text>

  <!-- Sub -->
  <text x="90" y="530" fill="#5567A0" font-family="Inter, sans-serif" font-weight="400" font-size="22">Swiggy and Zomato settlement reports, turned into a clean, readable profit report.</text>

  <!-- Accent line -->
  <rect x="90" y="563" width="60" height="3" rx="1.5" fill="#00BF8F"/>

  <!-- Product-of badge -->
  <text x="1110" y="80" fill="#5567A0" font-family="Inter, sans-serif" font-weight="600" font-size="16" letter-spacing="2" text-anchor="end">A FOODNOMIX PRODUCT</text>
</svg>
